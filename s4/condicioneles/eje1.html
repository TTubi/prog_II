<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio_1</title>
    <script>
        var edad = prompt("Ingrese su edad",)
        var esMayor

        if(edad >= 18){
            esMayor = 1
        }
        else{
            esMayor = 0
        }

        if(esMayor == 1){
            document.write("Usted es mayor de edad")
        }
        else{
            document.write("Usted es menor de edad")
        }
    </script>
</head>
<body>
    <!---Ejercicio 1: Verificación de mayoría de edad
Pedir al usuario su edad mediante prompt y mostrar un mensaje que indique si es mayor o menor
de edad. -->
</body>
</html>
