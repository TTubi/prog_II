    <script>

        let base, altura, area
        base = Number(prompt("Ingrese la base del rectangulo: "))
        altura = Number(prompt("Ingrese la altura del rectangulo: "))

        function calcularAreaRectangulo(area){
            area = base * altura
            console.log(`El area del rectangulo es de ${area}`)
        }

        calcularAreaRectangulo(area)
